<html lang="en">

<title>Beethoven & Berwald — 25 Sep 2026</title>

<style>
  :root{
    --bg:#f8f3e0;
    --ink:#23221e;
    --coral:#f76c41;
    --sky:#7bbde0;
    --leaf:#3e9c66;
    --gold:#f3e278;
    --paper:#fffdf6;
    --env:#efe6cc;
    --env-dark:#e3d8b8;
    --line: rgba(35,34,30,0.16);
    --shadow: rgba(35,34,30,0.24);
    --logo-filter: none;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#1e1c17;
      --ink:#f3ead2;
      --paper:#2a2620;
      --env:#332e24;
      --env-dark:#211e18;
      --line: rgba(243,234,210,0.18);
      --shadow: rgba(0,0,0,0.55);
      --logo-filter: invert(1) brightness(1.15);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1e1c17;
    --ink:#f3ead2;
    --paper:#2a2620;
    --env:#332e24;
    --env-dark:#211e18;
    --line: rgba(243,234,210,0.18);
    --shadow: rgba(0,0,0,0.55);
    --logo-filter: invert(1) brightness(1.15);
  }

  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{margin:0; background:var(--bg); color:var(--ink);}
  body{
    font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
    font-weight:400;
    line-height:1.65;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,h3{font-family:"Baloo 2","IBM Plex Sans Thai",sans-serif; margin:0; font-weight:700;}
  .script{font-family:"Caveat","IBM Plex Sans Thai",cursive;}
  button{font-family:inherit;}

  .lines{
    position:fixed; inset:0; z-index:-2;
    background-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 27px, var(--coral) 27px, var(--coral) 28px);
    opacity:.14;
    pointer-events:none;
  }
  .doodle{position:absolute; z-index:-1; opacity:.85; pointer-events:none;}

  .wrap{max-width:520px; margin:0 auto; padding:0 20px 64px; position:relative;}

  /* ---------- header ---------- */
  header{padding:22px 0 8px; text-align:center; position:relative;}
  .langtoggle{
    position:absolute; top:22px; right:20px;
    display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden;
    font-size:.72rem; font-weight:600; letter-spacing:.04em;
  }
  .langtoggle button{
    border:none; background:transparent; color:var(--ink);
    padding:6px 12px; cursor:pointer; opacity:.55;
  }
  .langtoggle button.active{background:var(--coral); color:#fffdf6; opacity:1;}
  .langtoggle button:focus-visible{outline:2px solid var(--sky);}

  .logo-img{
    display:block; margin:6px auto 4px; width:min(78vw, 360px); height:auto;
    filter:var(--logo-filter);
  }
  .kicker{
    font-family:"Caveat", cursive; font-size:1.3rem; color:var(--leaf);
    margin-top:2px; display:block;
  }
  .meta{margin-top:14px; font-size:.95rem; opacity:.85;}
  .meta strong{font-weight:600;}
  .meta .venue{display:block; margin-top:2px; font-size:.85rem; opacity:.8;}

  /* ---------- envelope (diamond flap) ---------- */
  .letters{margin-top:34px; display:flex; flex-direction:column; gap:26px;}
  .envelope-btn{
    border:none; background:none; padding:0; width:100%;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    display:block;
  }
  .envelope-btn:focus-visible .env-frame{outline:3px solid var(--sky); outline-offset:3px; border-radius:8px;}
  .env-frame{
    position:relative;
    width:100%;
    aspect-ratio: 3 / 3.7;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 12px 26px -16px var(--shadow);
    transition:transform .18s ease;
  }
  .envelope-btn:active .env-frame{transform:scale(.985);}
  .flap{position:absolute; inset:0;}
  .flap-top{ background:var(--env-dark); clip-path:polygon(0% 0%, 100% 0%, 50% 52%); }
  .flap-left{ background:var(--env); clip-path:polygon(0% 0%, 0% 100%, 50% 52%); }
  .flap-right{ background:var(--env); clip-path:polygon(100% 0%, 100% 100%, 50% 52%); }
  .flap-bottom{ background:var(--env); clip-path:polygon(0% 100%, 100% 100%, 50% 52%); }

  .seal{
    position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
    width:15%; aspect-ratio:1/1; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fffdf6; font-family:"Baloo 2",sans-serif; font-weight:700; font-size:.85rem;
    box-shadow:0 3px 0 rgba(0,0,0,.15) inset, 0 4px 10px -4px var(--shadow);
    z-index:3;
  }
  .env-signoff{
    position:absolute; left:0; right:0; bottom:9%; text-align:center;
    font-size:.68rem; letter-spacing:.14em; opacity:.6; z-index:2;
  }

  .env-letter{
    position:absolute; left:6%; right:6%; top:6%; height:56%;
    background:var(--paper);
    border-radius:3px 3px 8px 8px;
    box-shadow:0 8px 18px -10px var(--shadow);
    padding:12% 9% 10%;
    text-align:left;
    z-index:4;
    display:flex; flex-direction:column;
  }
  .env-label{
    font-size:.62rem; letter-spacing:.14em; font-weight:600; opacity:.65;
    padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:10px;
  }
  .env-headline{
    font-family:"Baloo 2",sans-serif; font-weight:700;
    font-size:clamp(1.05rem, 4.6vw, 1.3rem);
    line-height:1.18;
  }
  .env-sub{
    margin-top:8px; font-size:.82rem; font-style:italic; opacity:.75; line-height:1.4;
  }
  .env-cta{
    margin-top:auto; padding-top:10px; font-size:.72rem; opacity:.55;
    display:flex; align-items:center; gap:6px;
  }

  /* ---------- ensemble ---------- */
  .ensemble-head{margin-top:46px; text-align:center;}
  .ensemble-head .script{font-size:1.4rem; color:var(--coral); display:block;}
  .ensemble-head h2{font-size:1.4rem; margin-top:4px;}

  .stamps{
    margin-top:28px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px 16px;
  }

    transition:transform .15s ease;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    position:relative;
  }
  .stamp:active{transform:scale(.96);}
  .stamp:focus-visible{outline:3px solid var(--sky); outline-offset:3px;}
  .stamp-inner-frame{
    position:absolute; inset:11%;
    border:1px solid var(--line);
    pointer-events:none;
  }
  .stamp img{
    width:66%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:50%;
    display:block;
    margin:6% auto 5%;
  }
  .stamp .p-name{font-size:.78rem; font-weight:600; line-height:1.2; text-align:center; padding:0 4%;}
  .stamp .p-inst{font-size:.7rem; opacity:.66; margin-top:2px; text-align:center;}

  /* ---------- tickets / footer ---------- */
  .tickets{margin-top:48px; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:20px;}
  .tickets h3{font-size:1.05rem;}
  .ticket-row{display:flex; justify-content:space-between; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); font-size:.95rem;}
  .ticket-row:first-of-type{border-top:none; padding-top:0; margin-top:12px;}
  .ticket-row span:last-child{font-weight:600;}
  .program-recap{margin-top:22px; font-size:.86rem; opacity:.8; padding-left:1.1em;}
  .program-recap li{margin-top:6px;}
  footer{margin-top:40px; text-align:center; font-size:.8rem; opacity:.6;}

  /* ---------- modal (letter / bio) ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,18,14,.5); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
    opacity:0; pointer-events:none; transition:opacity .22s ease;
  }
  .modal-backdrop.show{opacity:1; pointer-events:auto;}
  .modal{
    background:var(--paper); width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
    border-radius:18px 18px 0 0; padding:26px 22px calc(30px + env(safe-area-inset-bottom,0px));
    transform:translateY(24px); transition:transform .26s cubic-bezier(.2,.8,.3,1);
    position:relative;
  }
  .modal-backdrop.show .modal{transform:translateY(0);}
  .modal-close{
    position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%;
    border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:1.1rem;
    line-height:1; cursor:pointer;
  }
  .modal-close:focus-visible{outline:3px solid var(--sky);}

  .letter-label{font-size:.68rem; letter-spacing:.14em; font-weight:600; opacity:.6; padding-bottom:10px; border-bottom:1px solid var(--line);}
  .letter-headline{font-family:"Baloo 2",sans-serif; font-size:1.5rem; line-height:1.2; margin-top:16px;}
  .letter-sub{font-size:.95rem; font-style:italic; opacity:.75; margin-top:8px;}
  .divider{margin:20px 0; border:none; border-top:1px dashed var(--line);}
  .letter-body{font-size:1rem; line-height:1.8; white-space:pre-line;}
  .letter-body .salutation, .letter-body .signature{font-family:"Caveat",cursive; font-size:1.35rem;}

  .bio-photo{width:96px; height:96px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 14px;}
  .bio-name{text-align:center; font-size:1.2rem;}
  .bio-inst{text-align:center; font-size:.88rem; color:var(--leaf); font-weight:600; margin-top:2px;}
  .bio-text{margin-top:16px; font-size:.94rem; line-height:1.7; opacity:.88;}

  @media (prefers-reduced-motion: reduce){
    .env-frame, .stamp, .modal, .modal-backdrop{transition:none !important;}
  }

const beethovenLetter = {
  seal:'LvB', color:'var(--coral)',
  label:{en:'A LETTER FROM BEETHOVEN', th:'จดหมายจาก Beethoven'},
  headline:{en:'Each with its own character, each expected to speak.', th:'เครื่องดนตรีทั้งเจ็ดมีบุคลิกของตัวเอง'},
  sub:{en:'I did not wish for any of them to stand quietly in the corner.', th:'และทุกชิ้นได้รับพื้นที่ให้พูด'},
  body:{
    en:`<span class="salutation">Dearest Gentle Reader,</span>

Allow me to tell you a little secret about my Septet in E-flat major, Op. 20.

When I wrote it around the year 1800, I could hardly have imagined that this particular work would travel so far, or remain in the company of audiences long after its first appearance in Vienna.

At that time, I was still making my way as a composer in this city. The world had not yet heard the works by which you may now remember me — no Für Elise, no Fifth Symphony, no Ode to Joy. And yet, somehow, this Septet found its listeners.

Perhaps I know why.

I gave it seven voices: violin, viola, cello, double bass, clarinet, bassoon, and horn. Seven instruments, each with its own character, each expected to speak. I did not wish for any of them merely to stand quietly in the corner while the others carried the conversation.

The work was first performed in Vienna on 2 April 1800, at a concert of my own. Six movements, seven voices, and quite a great deal of conversation between them.

And the audience listened.

So, dear reader, I shall leave you with a question rather than an answer:

When two composers are given the same seven voices,
what different worlds might they create?

You may listen and decide for yourself.

<span class="signature">Yours, with considerable curiosity,
L. v. Beethoven</span>`,
    th:`<span class="salutation">Dearest Gentle Reader,</span>

ขออนุญาตเล่าเรื่องเล็ก ๆ เรื่องหนึ่งเกี่ยวกับ Septet in E-flat major, Op. 20 ของข้าพเจ้า

เมื่อข้าพเจ้าประพันธ์บทเพลงนี้ขึ้นราวปี ค.ศ. 1800 ข้าพเจ้าเองก็คงไม่อาจคาดคิดว่า Septet ชิ้นนี้จะเดินทางไปไกลเพียงใด หรือจะยังคงอยู่กับผู้ฟังไปอีกนาน หลังจากการบรรเลงครั้งแรกในกรุงเวียนนา

ในเวลานั้น ข้าพเจ้ายังอยู่ระหว่างการสร้างเส้นทางของตนเองในฐานะคีตกวีแห่งกรุงเวียนนา โลกยังไม่ได้รู้จักบทเพลงที่ภายหลังจะทำให้พวกท่านจดจำชื่อของข้าพเจ้าได้ — ยังไม่มี Für Elise, ยังไม่มีซิมโฟนีหมายเลข 5 และยังไม่มี Ode to Joy

แต่ถึงกระนั้น Septet บทนี้กลับมีผู้ฟังของมัน

บางที ข้าพเจ้าพอจะรู้เหตุผลอยู่บ้าง

const berwaldLetter = {
  seal:'FB', color:'var(--sky)',
  label:{en:'A LETTER FROM BERWALD', th:'จดหมายจาก Franz Berwald'},
  headline:{en:'The same seven voices were there.', th:'เสียงทั้งเจ็ดยังคงอยู่ตรงนั้น'},
  sub:{en:'But I asked them different questions.', th:'แต่ข้าพเจ้าตั้งคำถามกับพวกมันแตกต่างออกไป'},
  body:{
    en:`<span class="salutation">Dearest Gentle Reader,</span>

Allow me to tell you a little about my Septet in B-flat major.

I had spent much of my life surrounded by music — studying it, performing it, listening to the works of those who came before me.

As a violinist, and later as a violist in the Royal Court Orchestra in Stockholm, I was fortunate to live among musicians. I heard their instruments at close range, learned their particular ways of speaking, and came to know the possibilities that could emerge when different voices were placed together.

In 1817, I brought seven of them together:
violin, viola, cello, double bass, clarinet, bassoon, and horn.

The same seven voices were there.
But I asked them different questions.

I wished to find my own path — to discover what these instruments might say when given a different kind of conversation, a different balance, a different world in which to speak.

The music was first performed in Stockholm in 1818, by musicians from the Royal Court Orchestra. And even then, I continued to return to the work, revising it and listening again.

Perhaps that is the nature of finding one's own voice.
One does not simply write a piece and leave it behind.
One listens.
One questions.
One begins again.

And now, dear reader, the music has arrived in your hands — or perhaps, more properly, in your ears.
You have heard seven voices before.
You have now heard them again.

So I wonder:
When the same seven voices speak in another musical world,
how has your world of listening changed?

I shall leave that question with you.

<span class="signature">Yours sincerely,
Franz Berwald</span>`,

ข้าพเจ้าใช้เวลาส่วนใหญ่ของชีวิตอยู่ท่ามกลางเสียงดนตรี — ศึกษามัน บรรเลงมัน และฟังผลงานของผู้ที่เดินทางมาก่อนหน้า

ในฐานะนักไวโอลิน และต่อมาในฐานะนักวิโอลาใน Royal Court Orchestra แห่งกรุงสตอกโฮล์ม ข้าพเจ้าโชคดีที่ได้ใช้ชีวิตอยู่ท่ามกลางเหล่านักดนตรี ได้ยินเสียงเครื่องดนตรีเหล่านั้นอย่างใกล้ชิด เรียนรู้วิธีที่แต่ละเสียงพูด และค้นพบความเป็นไปได้ที่จะเกิดขึ้นเมื่อเสียงที่แตกต่างกันมาอยู่ร่วมกัน

ไวโอลิน วิโอลา เชลโล ดับเบิลเบส คลาริเน็ต บาสซูน และฮอร์น

ข้าพเจ้าต้องการค้นหาเส้นทางของตัวเอง — ค้นหาว่าเครื่องดนตรีเหล่านี้จะพูดอะไรได้บ้าง หากพวกมันได้พบกับบทสนทนาอีกแบบหนึ่ง สมดุลอีกแบบหนึ่ง และโลกอีกใบหนึ่งที่เปิดพื้นที่ให้พวกมันได้พูด

/* ---------- render ---------- */
const stampsEl = document.getElementById('stamps');
function buildStamps(){
  stampsEl.innerHTML = '';
  performers.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'stamp';
    btn.innerHTML = `<span class="stamp-inner-frame"></span><img src="${photos[p.id]}" alt="${p.name}"><span class="p-name">${p.name}</span><span class="p-inst">${p.inst[lang]}</span>`;
    btn.addEventListener('click', () => openBio(p));
    stampsEl.appendChild(btn);
  });
}

function renderStrings(){
  document.getElementById('meta-date').innerHTML = strings.meta_date[lang];
  document.querySelector('.meta .venue').textContent = strings.meta_venue[lang];
  document.getElementById('ensemble-kicker').textContent = strings.ensemble_kicker[lang];
  document.getElementById('ensemble-heading').textContent = strings.ensemble_heading[lang];
  document.getElementById('tickets-heading').textContent = strings.tickets_heading[lang];
  document.getElementById('ticket-general-label').textContent = strings.ticket_general_label[lang];
  document.getElementById('ticket-student-label').textContent = strings.ticket_student_label[lang];
  document.getElementById('ticket-general-price').textContent = strings.ticket_general_price[lang];
  document.getElementById('ticket-student-price').textContent = strings.ticket_student_price[lang];

  const recap = document.getElementById('program-recap');
  recap.innerHTML = '';
  strings.program_items[lang].forEach(t => {
    const li = document.createElement('li');
    li.textContent = t;
    recap.appendChild(li);
  });

  document.getElementById('teaser-label-beethoven').textContent = beethovenLetter.label[lang];
  document.getElementById('teaser-head-beethoven').textContent = beethovenLetter.headline[lang];
  document.getElementById('teaser-sub-beethoven').textContent = beethovenLetter.sub[lang];
  document.getElementById('teaser-cta-beethoven').textContent = strings.teaser_cta[lang];

  document.getElementById('teaser-label-berwald').textContent = berwaldLetter.label[lang];
  document.getElementById('teaser-head-berwald').textContent = berwaldLetter.headline[lang];
  document.getElementById('teaser-sub-berwald').textContent = berwaldLetter.sub[lang];
  document.getElementById('teaser-cta-berwald').textContent = strings.teaser_cta[lang];

  document.documentElement.lang = lang;
  buildStamps();
}

document.getElementById('lang-en').addEventListener('click', () => setLang('en'));
document.getElementById('lang-th').addEventListener('click', () => setLang('th'));
function setLang(l){
  lang = l;
  document.getElementById('lang-en').classList.toggle('active', l==='en');
  document.getElementById('lang-th').classList.toggle('active', l==='th');
  renderStrings();
}

/* ---------- modal ---------- */
const backdrop = document.getElementById('modal-backdrop');
const modalBody = document.getElementById('modal-body');
const modalContent = document.getElementById('modal-content');

function openModal(){
  backdrop.classList.add('show');
  document.body.style.overflow='hidden';
  modalContent.focus();
}
function closeModal(){
  backdrop.classList.remove('show');
  document.body.style.overflow='';
}
document.getElementById('modal-close').addEventListener('click', closeModal);
backdrop.addEventListener('click', (e) => { if(e.target === backdrop) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });

function openBio(p){
  modalBody.innerHTML = `
    <img class="bio-photo" src="${photos[p.id]}" alt="${p.name}">
    <div class="bio-name">${p.name}</div>
    <div class="bio-inst">${p.inst[lang]}</div>
    <p class="bio-text">${p.bio[lang]}</p>
  `;
  openModal();
}

function openLetter(data){
  modalBody.innerHTML = `
    <div class="letter-label">${data.label[lang]}</div>
    <div class="letter-headline">${data.headline[lang]}</div>
    <div class="letter-sub">${data.sub[lang]}</div>
    <hr class="divider">
    <div class="letter-body">${data.body[lang]}</div>
  `;
  openModal();
}

document.getElementById('env-beethoven').addEventListener('click', () => openLetter(beethovenLetter));
document.getElementById('env-berwald').addEventListener('click', () => openLetter(berwaldLetter));

renderStrings();
</script>
</body>
</html>
